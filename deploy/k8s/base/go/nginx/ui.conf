# 在现有同源 HTTPS server 中引用，并沿用站点的 mime.types。
location ^~ /assets/ {
    root /var/lib/omnirelay/ui;
    autoindex off;
    try_files $uri @omnirelay_missing_asset;
    add_header Cache-Control "public, max-age=31536000, immutable";
    add_header X-OmniRelay-Asset-Archive 1;
    add_header X-Content-Type-Options nosniff always;
}

location ~ ^/[A-Za-z0-9_-]+\.(js|css|png)$ {
    root /var/lib/omnirelay/ui/legacy;
    try_files $uri @omnirelay_missing_asset;
    add_header Cache-Control "no-cache";
    add_header X-OmniRelay-Asset-Archive 1;
    add_header X-Content-Type-Options nosniff always;
}

location @omnirelay_missing_asset {
    add_header Cache-Control "no-store" always;
    add_header X-Content-Type-Options nosniff always;
    return 404;
}
