apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata:
  name: omnirelay-dshbot
spec:
  podSelector:
    matchLabels: {app.kubernetes.io/name: omnirelay-dshbot}
  policyTypes: [Ingress, Egress]
---
apiVersion: v1
kind: PersistentVolumeClaim
metadata:
  name: omnirelay-dshbot
spec:
  accessModes: [ReadWriteOnce]
  storageClassName: omni-local-retain
  resources:
    requests: {storage: 1Gi}
