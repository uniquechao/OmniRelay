apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata:
  name: omnirelay-dshbot
spec:
  podSelector:
    matchLabels: {app.kubernetes.io/name: omnirelay-dshbot}
  policyTypes: [Ingress, Egress]
---
apiVersion: v1
kind: PersistentVolumeClaim
metadata:
  name: omnirelay-dshbot
spec:
  accessModes: [ReadWriteOnce]
  storageClassName: omni-local-retain
  resources:
    requests: {storage: 1Gi}
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: omnirelay-dshbot
spec:
  replicas: 1
  strategy: {type: Recreate}
  selector:
    matchLabels: {app.kubernetes.io/name: omnirelay-dshbot}
  template:
    metadata:
      labels: {app.kubernetes.io/name: omnirelay-dshbot}
    spec:
      automountServiceAccountToken: false
      enableServiceLinks: false
      affinity:
        podAffinity:
          requiredDuringSchedulingIgnoredDuringExecution:
            - labelSelector:
                matchLabels: {app.kubernetes.io/name: omnirelay}
              topologyKey: kubernetes.io/hostname
      securityContext:
        runAsNonRoot: true
        runAsUser: 10002
        runAsGroup: 10000
        fsGroup: 10000
        fsGroupChangePolicy: OnRootMismatch
        seccompProfile: {type: RuntimeDefault}
      initContainers:
        - name: directories
          image: OMNIRELAY_DSHBOT_IMAGE
          command: [python, -c]
          args:
            - |
              import os
              for path, mode in [('/state/ipc', 0o2750), ('/state/home', 0o700)]:
                  os.makedirs(path, exist_ok=True)
                  os.chmod(path, mode)
          securityContext:
            allowPrivilegeEscalation: false
            readOnlyRootFilesystem: true
            capabilities: {drop: [ALL]}
          volumeMounts:
            - {name: state, mountPath: /state}
      containers:
        - name: debug
          image: OMNIRELAY_DSHBOT_IMAGE
          args: ["-origin", "$(PUBLIC_ORIGIN)", "-home", "/var/lib/dshbot"]
          env:
            - name: PUBLIC_ORIGIN
              valueFrom:
                configMapKeyRef: {name: omnirelay-runtime, key: OMNIRELAY_PUBLIC_ORIGIN}
          securityContext:
            allowPrivilegeEscalation: false
            readOnlyRootFilesystem: true
            capabilities: {drop: [ALL]}
          resources:
            requests: {cpu: 100m, memory: 128Mi}
            limits: {cpu: "1", memory: 1Gi}
          readinessProbe:
            exec:
              command:
                - python
                - -c
                - |
                  import socket
                  with socket.socket(socket.AF_UNIX) as s:
                      s.settimeout(3)
                      s.connect('/run/omnirelay-dshbot/web.sock')
                      s.sendall(b'GET / HTTP/1.0\r\nHost: dshbot\r\n\r\n')
                      assert b' 200 ' in s.makefile('rb').readline()
            timeoutSeconds: 5
            periodSeconds: 10
          volumeMounts:
            - {name: state, mountPath: /run/omnirelay-dshbot, subPath: ipc}
            - {name: state, mountPath: /var/lib/dshbot, subPath: home}
            - {name: tmp, mountPath: /tmp}
      volumes:
        - name: state
          persistentVolumeClaim: {claimName: omnirelay-dshbot}
        - name: tmp
          emptyDir: {sizeLimit: 256Mi}
