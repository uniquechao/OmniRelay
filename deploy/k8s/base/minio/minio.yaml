apiVersion: v1
kind: Service
metadata:
  name: minio
  namespace: omni
  labels:
    app.kubernetes.io/part-of: omnirelay
spec:
  type: ClusterIP
  selector:
    app.kubernetes.io/name: minio
    app.kubernetes.io/part-of: omnirelay
  ports:
    - name: s3
      port: 9000
      targetPort: s3
---
apiVersion: v1
kind: Service
metadata:
  name: minio-headless
  namespace: omni
  labels:
    app.kubernetes.io/part-of: omnirelay
spec:
  clusterIP: None
  selector:
    app.kubernetes.io/name: minio
    app.kubernetes.io/part-of: omnirelay
  ports:
    - name: s3
      port: 9000
      targetPort: s3
---
apiVersion: apps/v1
kind: StatefulSet
metadata:
  name: minio
  namespace: omni
  labels:
    app.kubernetes.io/part-of: omnirelay
spec:
  serviceName: minio-headless
  replicas: 1
  selector:
    matchLabels:
      app.kubernetes.io/name: minio
      app.kubernetes.io/part-of: omnirelay
  template:
    metadata:
      labels:
        app.kubernetes.io/name: minio
        app.kubernetes.io/part-of: omnirelay
    spec:
      automountServiceAccountToken: false
      securityContext:
        runAsNonRoot: true
        runAsUser: 1000
        runAsGroup: 1000
        fsGroup: 1000
        seccompProfile:
          type: RuntimeDefault
      containers:
        - name: minio
          image: docker.io/pgsty/silo:RELEASE.2026-11-12T00-00-00Z@sha256:c20d112390b9a9ce8c11b8af95ad35bcaa62f4759663c09c936cd8d2b511f329
          imagePullPolicy: IfNotPresent
          command: ["/usr/bin/silo"]
          args: ["--certs-dir", "/run/s3-tls", "server", "/data", "--address", ":9000"]
          env:
            - name: HOME
              value: /tmp
            - name: MINIO_BROWSER
              value: "off"
            - name: MINIO_UPDATE
              value: "off"
            - name: MINIO_ROOT_USER
              valueFrom:
                secretKeyRef:
                  name: minio-root
                  key: MINIO_ROOT_USER
            - name: MINIO_ROOT_PASSWORD
              valueFrom:
                secretKeyRef:
                  name: minio-root
                  key: MINIO_ROOT_PASSWORD
          ports:
            - name: s3
              containerPort: 9000
          startupProbe:
            httpGet:
              path: /minio/health/live
              port: s3
              scheme: HTTPS
            failureThreshold: 30
            periodSeconds: 2
          readinessProbe:
            httpGet:
              path: /minio/health/ready
              port: s3
              scheme: HTTPS
          livenessProbe:
            httpGet:
              path: /minio/health/live
              port: s3
              scheme: HTTPS
            periodSeconds: 15
          securityContext:
            allowPrivilegeEscalation: false
            readOnlyRootFilesystem: true
            capabilities:
              drop: ["ALL"]
          resources:
            requests:
              cpu: 250m
              memory: 512Mi
            limits:
              cpu: "2"
              memory: 2Gi
          volumeMounts:
            - name: data
              mountPath: /data
            - name: tls
              mountPath: /run/s3-tls
              readOnly: true
            - name: temporary
              mountPath: /tmp
      volumes:
        - name: tls
          secret:
            secretName: minio-tls
            defaultMode: 0440
        - name: temporary
          emptyDir:
            sizeLimit: 128Mi
  volumeClaimTemplates:
    - metadata:
        name: data
        labels:
          app.kubernetes.io/part-of: omnirelay
      spec:
        accessModes: ["ReadWriteOnce"]
        storageClassName: omni-local-retain
        resources:
          requests:
            storage: 10Gi
---
apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata:
  name: minio
  namespace: omni
  labels:
    app.kubernetes.io/part-of: omnirelay
spec:
  podSelector:
    matchLabels:
      app.kubernetes.io/name: minio
      app.kubernetes.io/part-of: omnirelay
  policyTypes: [Ingress, Egress]
  ingress:
    - from:
        - podSelector:
            matchLabels:
              app.kubernetes.io/name: omnirelay
              omnirelay.io/s3-access: "true"
      ports:
        - protocol: TCP
          port: 9000
