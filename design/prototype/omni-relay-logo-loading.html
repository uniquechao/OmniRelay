<link rel="stylesheet" href="omni-relay-colors.css">
<style>
* { box-sizing: border-box; }
:root { color-scheme: light; font-family: Inter, "PingFang SC", "Microsoft YaHei", sans-serif; }
html[data-theme="dark"] { color-scheme: dark; }
body { margin: 0; min-height: 100svh; background: var(--or-surface); color: var(--or-text); }
button { font: inherit; cursor: pointer; touch-action: manipulation; }
.control:disabled { opacity: .5; cursor: default; }
button:focus-visible { outline: 2px solid var(--or-primary); outline-offset: 4px; }
.controls { position: fixed; top: 22px; right: 24px; z-index: 2; display: flex; gap: 8px; }
.control {
  display: inline-grid; place-items: center; min-height: 44px; padding: 0 13px;
  border: 1px solid var(--or-border); border-radius: 7px;
  background: var(--or-surface); color: var(--or-text-secondary); font-size: 12px;
}
.control:hover { background: var(--or-hover-bg); }
main { min-height: 100svh; display: grid; place-items: center; padding: 80px 24px; }
.loading { width: min(420px, 100%); text-align: center; }
.mark { width: min(360px, 100%); aspect-ratio: 1; margin: 0 auto 12px; display: grid; place-items: center; }
.mark svg { width: 100%; overflow: visible; }
body { overflow-x: clip; }
.wordmark { margin: 0; font-size: clamp(27px, 5vw, 32px); font-weight: 650; letter-spacing: -.9px; line-height: 1.2; }
.wordmark span:first-child { color: var(--or-brand-indigo); }
.wordmark span:last-child { color: var(--or-brand-teal); }
.track { height: 3px; width: min(280px, 100%); margin: 34px auto 13px; border-radius: 9px; background: var(--or-surface-muted); overflow: hidden; }
.fill { width: 0; height: 100%; background: linear-gradient(90deg, var(--or-brand-indigo),var(--or-brand-teal)); border-radius: inherit; }
.progress-meta { display: flex; align-items: baseline; justify-content: space-between; width: min(280px, 100%); margin: auto; gap: 10px; font-size: 12px; color: var(--or-text-muted); }
.progress-meta output { font-variant-numeric: tabular-nums; }
.replay { margin-top: 23px; background: transparent; border: 0; color: var(--or-text-muted); padding: 12px; min-height: 44px; font-size: 12px; }
.replay:hover { color: var(--or-link); }
.hint { position: fixed; left: 0; right: 0; bottom: 21px; margin: 0; text-align: center; color: var(--or-text-muted); font-size: 11px; }
@media (max-height: 620px) { main { padding-block: 55px; } .mark { width: min(240px, 60vw); margin-bottom: 0; } .track { margin-top: 22px; } }
</style>
</head>
<body>
<div class="controls">
  <a class="control" href="omni-relay-logo-motion-options.html" style="text-decoration:none">对比三种动效</a>
  <button class="control" id="pause" type="button" aria-pressed="false">暂停</button>
  <button class="control" id="theme" type="button" aria-pressed="false">深色</button>
</div>
<main>
  <section class="loading" aria-label="OmniRelay 加载演示">
    <div class="mark" aria-hidden="true">
      <svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 646 585"><defs>
          <linearGradient id="violetFacetrace" x1="0%" y1="0%" x2="84%" y2="78%">
            <stop stop-color="#bd64ff"/><stop offset=".38" stop-color="#7444fa"/><stop offset="1" stop-color="#452ee7"/>
          </linearGradient>
          <linearGradient id="tealFacetrace" x1="20%" y1="28%" x2="90%" y2="88%">
            <stop stop-color="#008e89"/><stop offset=".5" stop-color="#09b7b6"/><stop offset="1" stop-color="#00e2e9"/>
          </linearGradient>
        <mask id="violetInk" maskUnits="userSpaceOnUse" x="0" y="0" width="646" height="585"><path class="ink violet-ink" d="M 509 200 Q 458 150 419 150 H 222 Q 191 150 169 180 L 117 249 Q 83 294 112 333 L 143 367" fill="none" stroke="white" stroke-width="175" stroke-linecap="round" pathLength="1" stroke-dasharray="1 2"/></mask><mask id="tealInk" maskUnits="userSpaceOnUse" x="0" y="0" width="646" height="585"><path class="ink teal-ink" d="M 150 356 Q 188 434 231 434 H 389 Q 452 434 485 391 L 535 328 Q 561 293 543 260 L 497 209" fill="none" stroke="white" stroke-width="175" stroke-linecap="round" pathLength="1" stroke-dasharray="1 2"/></mask></defs>
        <g class="orbit"><path class="arc violet" mask="url(#violetInk)" fill="url(#violetFacetrace)" d="M 101 400 L 76 367 Q 20 296 76 220 L 139 139 Q 168 103 222 103 H 420 Q 477 103 512 148 L 531 172 L 469 264 Q 442 201 386 201 H 261 Q 226 201 202 231 Q 164 275 178 317 Z"/>
        <path class="arc teal" mask="url(#tealInk)" fill="url(#tealFacetrace)" d="M 530.5 171.5 L 572 224 Q 624 292 574 361 L 509 445 Q 480 482 422 482 H 230 Q 171 482 137 446 L 100.5 399.5 L 177.5 316.5 Q 211 384 266 384 H 383 Q 427 384 450 348 Q 482 306 468.5 263.5 Z"/></g></svg>
    </div>
    <h1 class="wordmark" aria-label="OmniRelay"><span>Omni</span><span>Relay</span></h1>
    <div class="track" role="progressbar" aria-label="演示加载进度" aria-valuemin="0" aria-valuemax="100" aria-valuenow="0"><div class="fill"></div></div>
    <div class="progress-meta"><span id="stage" role="status">建立连接</span><output id="percent" aria-hidden="true">0%</output></div>
    <button class="replay" id="replay" type="button">重新播放</button>
  </section>
</main>
<p class="hint">循光成环 · 加载动效演示</p>
<script>
(() => {
  const mark = document.querySelector('.mark');
  const violet = mark.querySelector('.violet');
  const teal = mark.querySelector('.teal');
  const violetInk = mark.querySelector('.violet-ink');
  const tealInk = mark.querySelector('.teal-ink');
  const track = document.querySelector('.track');
  const fill = document.querySelector('.fill');
  const stage = document.querySelector('#stage');
  const output = document.querySelector('#percent');
  const pause = document.querySelector('#pause');
  const media = matchMedia('(prefers-reduced-motion: reduce)');
  const duration = 1800;
  let elapsed = 0;
  let previous;
  let paused = false;
  let frame;
  let stageText = '';

  const clamp = value => Math.max(0, Math.min(1,value));
  function revealArc(face, ink, start, length, offsetY) {
    const t = media.matches ? 1 : clamp((elapsed - start) / length);
    const progress = t * t * (3 - 2 * t);
    const remaining = 1 - progress;
    ink.setAttribute('stroke-dashoffset', remaining);
    face.setAttribute('transform', `rotate(${9 * remaining} 323 292.5) translate(0 ${offsetY * remaining})`);
    face.style.opacity = Math.min(1, progress * 8);
  }
  function paint() {
    const t = clamp(elapsed / duration);
    revealArc(violet, violetInk, 0, 1640, -42);
    revealArc(teal, tealInk, 100, 1700, 42);
    const progress = Math.floor(t * 100);
    fill.style.width = progress+'%';
    track.setAttribute('aria-valuenow',progress);
    output.textContent = progress+'%';
    const next = t >= 1 ? '已就绪' : t > .64 ? '准备工作空间' : t > .27 ? '汇聚工作上下文' : '建立连接';
    if (next !== stageText) { stage.textContent = next; stageText = next; }
    pause.disabled = t >= 1;
  }

  function tick(now) {
    if (previous !== undefined && !paused) elapsed = Math.min(duration,elapsed + now-previous);
    previous = now;
    paint();
    if (elapsed < duration) frame = requestAnimationFrame(tick);
  }
  function play() {
    cancelAnimationFrame(frame);
    elapsed = 0;
    previous = undefined;
    paused = false;
    pause.textContent = '暂停';
    pause.setAttribute('aria-pressed','false');
    pause.disabled = false;
    paint();
    frame = requestAnimationFrame(tick);
  }
  pause.addEventListener('click',() => {
    paused = !paused;
    pause.textContent = paused ? '继续' : '暂停';
    pause.setAttribute('aria-pressed',String(paused));
  });
  document.querySelector('#replay').addEventListener('click',play);
  document.querySelector('#theme').addEventListener('click',event => {
    const dark = document.documentElement.dataset.theme !== 'dark';
    document.documentElement.dataset.theme = dark ? 'dark' : 'light';
    event.currentTarget.textContent = dark ? '浅色' : '深色';
    event.currentTarget.setAttribute('aria-pressed',String(dark));
  });
  document.addEventListener('visibilitychange',() => { previous = undefined; });
  media.addEventListener('change',paint);
  play();
})();
</script>
</body>
</html>
