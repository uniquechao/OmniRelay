<!doctype html>
<html lang="zh-CN" data-theme="light">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>OmniRelay · 飞书消息卡片原型</title>
<link rel="stylesheet" href="omni-relay-colors.css">
<script src="omni-relay-theme.js"></script>
<style>
* { box-sizing: border-box; }
[hidden] { display: none !important; }
body { margin: 0; background: var(--or-canvas); color: var(--or-text); font: 14px/1.5 "Inter", -apple-system, BlinkMacSystemFont, "PingFang SC", sans-serif; }
h1, h2, h3, p, dl, dd { margin: 0; }
button, input, select, textarea { font: inherit; color: inherit; }
button { cursor: pointer; }
button:disabled { cursor: default; }
button, .card { transition: background-color .14s, border-color .14s; }
small { font-size: 12px; }
.shell { display: grid; grid-template-columns: 234px minmax(0, 1fr); min-height: 100svh; max-width: 1600px; margin-inline: auto; }
.rail { display: flex; flex-direction: column; align-items: stretch; gap: 24px; padding: 24px 17px 20px; background: var(--or-surface); border-right: 1px solid var(--or-border); }
.brand { display: block; width: 162px; height: auto; background: var(--or-brand-plate); border-radius: 6px; }
.preview-label { padding-inline: 9px; color: var(--or-text-muted); font-size: 12px; font-weight: 600; margin-bottom: 7px; }
.scene-list { display: grid; gap: 5px; }
.scene-button { width: 100%; display: block; border: 1px solid transparent; border-radius: 8px; background: transparent; padding: 9px 10px; text-align: left; color: var(--or-text); }
.scene-button:hover { background: var(--or-hover-bg); }
.scene-button:active { background: var(--or-pressed-bg); }
.scene-button strong { display: block; font-size: 14px; }
.scene-button small { display: block; color: var(--or-text-secondary); margin-top: 2px; }
.scene-button[aria-current="page"] { background: var(--or-selected-bg); border-color: var(--or-selected-edge); color: var(--or-link); }
.rail-foot { margin-top: auto; border-top: 1px solid var(--or-border); padding-top: 12px; }
.reset { border: 0; background: transparent; color: var(--or-text-muted); padding: 6px 8px; border-radius: 6px; font-size: 12px; }
.reset:hover { color: var(--or-link); background: var(--or-selected-bg); }
.workspace { min-width: 0; }
.chat-bar { display: flex; align-items: center; justify-content: space-between; flex-wrap: wrap; gap: 10px; padding: 14px clamp(18px, 4vw, 58px); background: var(--or-surface); border-bottom: 1px solid var(--or-border); }
.chat-name { display: flex; align-items: center; gap: 10px; }
.group-avatar { display: grid; place-items: center; width: 40px; height: 40px; border-radius: 10px; background: var(--or-selected-bg); color: var(--or-link); font-size: 17px; font-weight: 700; }
.chat-name h1 { font-size: 17px; letter-spacing: -.025em; }
.chat-name p { color: var(--or-text-muted); font-size: 12px; }
.theme-switch { display: flex; padding: 3px; gap: 2px; border-radius: 8px; background: var(--or-surface-muted); }
.theme-switch button { border: 0; border-radius: 6px; background: transparent; padding: 6px 10px; min-height: 32px; white-space: nowrap; font-size: 12px; }
.feed { box-sizing: content-box; max-width: 740px; margin-inline: auto; padding: 28px clamp(16px, 4.5vw, 64px) 38px; }
.date-line { display: flex; align-items: center; gap: 12px; margin-bottom: 23px; font-size: 12px; white-space: nowrap; color: var(--or-text-muted); }
.date-line::before, .date-line::after { content: ""; flex: 1; block-size: 1px; background: var(--or-border); }
.thread { display: grid; gap: 17px; animation: enter .18s ease-out both; }
@keyframes enter { from { opacity: .55; transform: translateY(4px); } to { opacity: 1; transform: translateY(0); } }
.message { display: grid; grid-template-columns: 34px minmax(0, 1fr); gap: 9px; align-items: start; }
.message-body { min-width: 0; }
.avatar { display: grid; place-items: center; width: 34px; height: 34px; border-radius: 9px; background: var(--or-important-bg); color: var(--or-important-text); font-weight: 700; object-fit: cover; }
.bot-avatar { background: var(--or-surface); border: 1px solid var(--or-border); }
.byline { display: flex; flex-wrap: wrap; gap: 6px 8px; align-items: center; margin: 0 0 5px; color: var(--or-text-secondary); min-height: 20px; font-size: 12px; }
.byline strong { color: var(--or-text); font-weight: 650; }
.byline time { color: var(--or-text-muted); font-variant-numeric: tabular-nums; }
.bot-label { padding: 1px 5px; border-radius: 4px; background: var(--or-surface-muted); color: var(--or-text-muted); font-size: 11px; }
.bubble { width: fit-content; max-width: 100%; padding: 9px 12px; border-radius: 0 8px 8px; background: var(--or-surface); border: 1px solid var(--or-border); overflow-wrap: anywhere; }
.mention { color: var(--or-link); font-weight: 650; }
.card { max-width: 605px; border: 1px solid var(--or-border); border-radius: 9px; background: var(--or-surface); }
.card-head { padding: 12px 15px; border-bottom: 1px solid var(--or-border); border-radius: 8px 8px 0 0; background: var(--or-surface); }
.card-head.brief-head { background: var(--or-selected-bg); }
.card-head h2 { font-size: 17px; font-weight: 700; line-height: 1.35; letter-spacing: -.015em; }
.card-head p { margin-top: 2px; color: var(--or-text-secondary); font-size: 12px; overflow-wrap: anywhere; }
.card-body { padding: 13px 15px 14px; }
.summary { padding: 8px 10px; border-radius: 6px; background: var(--or-agent-bg); color: var(--or-agent-text); overflow-wrap: anywhere; }
.summary b { margin-right: 6px; }
.progress-block { margin-top: 12px; }
.progress-caption { display: flex; justify-content: space-between; flex-wrap: wrap; gap: 2px 10px; font-size: 12px; color: var(--or-text-secondary); }
.progress-caption strong { color: var(--or-text); font-weight: 700; }
progress { display: block; margin-top: 5px; width: 100%; height: 5px; appearance: none; border: 0; border-radius: 5px; background: var(--or-surface-muted); }
progress::-webkit-progress-bar { background: var(--or-surface-muted); border-radius: 5px; }
progress::-webkit-progress-value { background: var(--or-primary); border-radius: 5px; }
progress::-moz-progress-bar { background: var(--or-primary); border-radius: 5px; }
.brief-items { margin-top: 6px; }
.brief-item { display: grid; grid-template-columns: auto minmax(0, 1fr); gap: 8px 10px; padding: 9px 0; align-items: baseline; }
.brief-item + .brief-item { border-top: 1px solid var(--or-border); }
.brief-item p { color: var(--or-text-secondary); font-size: 12px; margin-top: 2px; }
.badge { display: inline-block; width: fit-content; padding: 2px 6px; border-radius: 4px; background: var(--badge-bg); color: var(--badge-text); font-size: 11px; font-weight: 650; line-height: 1.5; white-space: nowrap; }
.badge[data-tone="important"] { --badge-bg: var(--or-important-bg); --badge-text: var(--or-important-text); }
.badge[data-tone="warning"] { --badge-bg: var(--or-warning-bg); --badge-text: var(--or-warning-text); }
.badge[data-tone="danger"] { --badge-bg: var(--or-danger-bg); --badge-text: var(--or-danger-text); }
.badge[data-tone="progress"] { --badge-bg: var(--or-progress-bg); --badge-text: var(--or-progress-text); }
.badge[data-tone="pending"] { --badge-bg: var(--or-pending-bg); --badge-text: var(--or-pending-text); }
.badge[data-tone="success"] { --badge-bg: var(--or-success-bg); --badge-text: var(--or-success-text); }
.task-link { padding: 0; border: 0; background: none; border-radius: 2px; color: var(--or-link); font-weight: 650; text-align: left; overflow-wrap: anywhere; }
.task-link:hover { text-decoration: underline; text-underline-offset: 2px; }
.actions { display: flex; flex-wrap: wrap; gap: 7px; margin-top: 11px; }
.btn { border: 1px solid; border-radius: 6px; padding: 6px 11px; min-height: 34px; text-align: center; font-size: 13px; font-weight: 600; }
.card-note { margin-top: 9px; color: var(--or-text-muted); font-size: 12px; }
.filter-bar { display: flex; flex-wrap: wrap; gap: 6px; align-items: center; }
.filter-button { padding: 5px 9px; min-height: 32px; border: 1px solid var(--or-border); border-radius: 6px; background: var(--or-surface); font-size: 12px; white-space: nowrap; }
.filter-button:hover { background: var(--or-hover-bg); }
.filter-button:active { background: var(--or-pressed-bg); }
.filter-button[aria-pressed="true"] { background: var(--or-selected-bg); color: var(--or-link); border-color: var(--or-selected-edge); font-weight: 650; }
.result-count { margin-top: 10px; color: var(--or-text-muted); font-size: 12px; }
.task-row { display: flex; justify-content: space-between; align-items: baseline; gap: 6px 8px; padding: 8px 0; border-bottom: 1px solid var(--or-border); min-width: 0; }
.task-row .task-link { font-size: 13px; }
.task-row p { color: var(--or-text-muted); font-size: 12px; margin-top: 2px; overflow-wrap: anywhere; }
.task-row > div { min-width: 0; }
.form { display: grid; gap: 10px; }
.field { min-width: 0; }
.field label { display: block; margin-bottom: 3px; font-weight: 600; font-size: 13px; }
.field label small { font-weight: 400; color: var(--or-text-muted); }
.field :is(input, select, textarea) { display: block; width: 100%; min-width: 0; min-height: 36px; padding: 6px 8px; border: 1px solid var(--or-control-border); border-radius: 6px; background: var(--or-surface); }
.field textarea { resize: vertical; }
.field :is(input, textarea)::placeholder { color: var(--or-text-muted); }
.field-pair { display: grid; gap: 9px; grid-template-columns: 1fr 1fr; }
.form .actions { margin-top: 0; }
.form-error { color: var(--or-danger-text); background: var(--or-danger-bg); border-radius: 6px; padding: 6px 8px; font-size: 12px; }
.receipt-header { background: var(--or-success-bg); color: var(--or-success-text); }
.receipt-header p { color: var(--or-success-text); }
.facts { display: grid; grid-template-columns: repeat(2, minmax(0, 1fr)); gap: 10px 12px; margin-top: 10px; }
.facts dt { color: var(--or-text-muted); font-size: 12px; }
.facts dd { font-weight: 650; overflow-wrap: anywhere; }
.dialog-task-text { color: var(--or-text-secondary); overflow-wrap: anywhere; white-space: pre-line; }
.dialog-record .facts { margin: 0; }
@media (max-width: 780px) {
  .shell { grid-template-columns: 1fr; }
  .rail { border-right: 0; border-bottom: 1px solid var(--or-border); padding: 9px 15px; gap: 6px; }
  .brand { width: 145px; }
  .preview-label, .scene-button small { display: none; }
  .scene-list { grid-template-columns: repeat(3, minmax(0, 1fr)); }
  .scene-button { text-align: center; padding: 6px 4px; }
  .scene-button strong { font-size: 13px; }
  .rail-foot { position: absolute; top: 19px; right: 13px; border: 0; padding: 0; }
  .chat-bar { padding: 10px 15px; }
  .feed { padding: 15px 13px 28px; }
  .date-line { margin-bottom: 14px; }
}
@media (max-width: 440px) {
  .message { grid-template-columns: minmax(0, 1fr); gap: 3px; }
  .message > .avatar { display: none; }
  .card-body, .card-head { padding-inline: 11px; }
  .field-pair { grid-template-columns: minmax(0, 1fr); }
}
@media (pointer: coarse) {
  .btn, .scene-button, .theme-switch button, .filter-button, .field :is(input, select, textarea) { min-height: 44px; }
  .task-link { min-height: 30px; }
}
@media (prefers-reduced-motion: reduce) {
  *, *::before, *::after { animation: none !important; transition: none !important; }
}
</style>
<link rel="stylesheet" href="omni-relay-interactions.css">
</head>
<body>
<svg class="symbols" aria-hidden="true" xmlns="http://www.w3.org/2000/svg">
  <symbol id="nav-logs" viewBox="0 0 24 24"><path d="M5 3.5h10l4 4v13H5zM15 3.5v4h4M8.5 11h7M8.5 15h7M8.5 18h4" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"/></symbol>
  <symbol id="action-close" viewBox="0 0 24 24"><path d="m6.5 6.5 11 11m0-11-11 11" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round"/></symbol>
</svg>
<div class="shell">
  <aside class="rail">
    <img class="brand" src="omni-relay-logo-bicolor.png" alt="OmniRelay" width="2172" height="724">
    <nav aria-label="卡片场景">
      <p class="preview-label">飞书卡片原型</p>
      <div class="scene-list">
        <button class="scene-button" type="button" data-scene="brief" aria-current="page"><strong>项目简报</strong><small>Bot 主动发到项目群</small></button>
        <button class="scene-button" type="button" data-scene="query"><strong>任务查询</strong><small>成员在群里 @ Bot</small></button>
        <button class="scene-button" type="button" data-scene="assign"><strong>任务分派</strong><small>补全负责人并取得回执</small></button>
      </div>
    </nav>
    <div class="rail-foot"><button type="button" class="reset" id="reset">重置演示</button></div>
  </aside>
  <main class="workspace">
    <header class="chat-bar">
      <div class="chat-name">
        <div class="group-avatar" aria-hidden="true">北</div>
        <div><h1>北辰交付项目</h1><p>飞书群聊预览 · 示例数据</p></div>
      </div>
      <div class="theme-switch" role="group" aria-label="配色主题">
        <button type="button" data-theme-choice="light" aria-pressed="true">浅色</button>
        <button type="button" data-theme-choice="dark" aria-pressed="false">深色</button>
      </div>
    </header>
    <section class="feed" aria-label="模拟会话">
      <div class="date-line"><time datetime="2026-11-18">11 月 18 日 · 周三</time></div>
      <div id="conversation"></div>
    </section>
  </main>
</div>
<div class="toast-region toast-region--fixed" id="toast-region" aria-label="浮动提示"></div>
<div class="sr-only" id="toast-status" role="status" aria-live="polite"></div>
<div class="sr-only" id="toast-urgent" role="alert"></div>
<script src="omni-relay-ui.js"></script>
<script>
const originalTasks = [
  { id: 'DEMO-007', title: '接口联调验收', owner: '王宁', date: '2026-11-20', status: 'progress', important: true, note: '验收主路径。待测试环境恢复后执行联调。' },
  { id: 'DEMO-008', title: '测试环境恢复', owner: '陈悦', date: '2026-11-19', status: 'danger', note: '环境尚未恢复，接口联调暂无法开始。需协调确认恢复时间。' },
  { id: 'DEMO-009', title: '灰度方案复核', owner: '林晓', date: '2026-11-20', status: 'pending', note: '核对覆盖范围与回滚条件。' },
  { id: 'DEMO-010', title: '验收用例确认', owner: '赵可', date: '2026-11-20', status: 'progress', note: '正在补齐异常路径的验收用例。' },
  { id: 'DEMO-011', title: '权限方案评审', owner: '王宁', date: '2026-11-18', status: 'success', note: '评审结论已同步，可继续推进相关开发。' },
  { id: 'DEMO-012', title: '回滚预案演练', owner: '陈悦', date: '2026-11-18', status: 'success', note: '演练记录与回滚时间已确认。' }
];
const members = ['王宁', '陈悦', '林晓', '赵可'];
const filterLabels = { open: '未完成', all: '全部', blocked: '已阻塞', done: '已完成' };
const statuses = {
  pending: ['○', '待开始'], progress: ['↻', '进行中'], danger: ['×', '已阻塞'],
  success: ['✓', '已完成'], important: ['◆', '重要任务'], warning: ['!', '重点关注']
};
const initialDraft = { title: '整理验收清单', owner: '', date: '2026-11-23', note: '' };
const conversation = document.getElementById('conversation');
let scene = 'brief';
let filter = 'open';
let draft = { ...initialDraft };
let receipt = null;

const { escape, openDialog, toast } = OmniRelayUI;
const readableDate = (date) => date ? Number(date.slice(5, 7)) + ' 月 ' + Number(date.slice(8, 10)) + ' 日' : '未设置';
const tasks = () => receipt ? [...originalTasks, receipt] : originalTasks;
const taskLink = (task) => '<button class="task-link" type="button" data-task="' + task.id + '">' + escape(task.title) + '</button>';
const button = (text, attrs, primary = false) => '<button class="btn' + (primary ? ' primary' : '') + '" type="button" ' + attrs + '>' + text + '</button>';

function badge(tone, label) {
  return '<span class="badge" data-tone="' + tone + '"><span aria-hidden="true">' +
    statuses[tone][0] + '</span> ' + (label || statuses[tone][1]) + '</span>';
}

function human(time, text) {
  return '<article class="message"><div class="avatar" aria-hidden="true">苏</div>' +
    '<div class="message-body"><div class="byline"><strong>苏涵</strong><time>' + time + '</time></div>' +
    '<p class="bubble">' + text + '</p></div></article>';
}

function bot(time, card) {
  return '<article class="message"><img class="avatar bot-avatar" src="omni-relay-avatar.png" width="34" height="34" alt="">' +
    '<div class="message-body"><div class="byline"><strong>OmniRelay</strong><span class="bot-label">机器人</span><time>' +
    time + '</time></div>' + card + '</div></article>';
}

function card(title, subtitle, content, headerClass = '') {
  return '<section class="card"><header class="card-head ' + headerClass + '"><h2 id="card-heading" tabindex="-1">' +
    title + '</h2><p>' + subtitle + '</p></header><div class="card-body">' + content + '</div></section>';
}

function briefCard() {
  const total = originalTasks.length;
  const done = originalTasks.filter(task => task.status === 'success').length;
  const [integration, environment, , , permissions] = originalTasks;
  return bot('18:00', card('项目每日简报', '北辰交付项目 · 11 月 18 日', `
    <p class="summary"><b>Agent 摘要</b>联调能否按期验收，取决于测试环境恢复时间。</p>
    <div class="progress-block">
      <div class="progress-caption"><span>共享任务进度</span><strong>已完成 ${done} / ${total}</strong></div>
      <progress max="${total}" value="${done}" aria-label="简报发布时的共享任务完成数"></progress>
    </div>
    <div class="brief-items">
      <div class="brief-item">${badge('important')}<div>${taskLink(integration)}<p>王宁 · 11 月 20 日截止 · 验收主路径</p></div></div>
      <div class="brief-item">${badge('warning')}<div>${taskLink(environment)}<p>陈悦 · 环境尚未恢复，联调仍无法开始</p></div></div>
      <div class="brief-item">${badge('success', '关键变化')}<div>${taskLink(permissions)}<p>评审已完成，相关开发可以继续</p></div></div>
    </div>
    <div class="actions">${button('查询项目任务', 'data-go="query"', true)}</div>
    <p class="card-note">简报数据截至 11 月 18 日 17:50 · 点任务标题查看依据</p>`, 'brief-head'));
}

function filteredTasks() {
  switch (filter) {
    case 'open': return tasks().filter(task => task.status !== 'success');
    case 'blocked': return tasks().filter(task => task.status === 'danger');
    case 'done': return tasks().filter(task => task.status === 'success');
    default: return tasks();
  }
}

function renderTaskResults() {
  const results = filteredTasks();
  return '<p class="result-count" role="status">共 ' + results.length + ' 项共享任务</p>' + results.map(task => `
    <div class="task-row"><div>${taskLink(task)}<p>${escape(task.owner)} · ${task.date ? '截止 ' + readableDate(task.date) : '未设置截止日期'}</p></div>${badge(task.status)}</div>
  `).join('');
}

function queryCard() {
  const filters = Object.entries(filterLabels).map(([id, label]) =>
    '<button class="filter-button" type="button" data-filter="' + id + '" aria-pressed="' + (filter === id) + '">' + label + '</button>'
  ).join('');
  return human('18:02', '<span class="mention">@OmniRelay</span> 查一下还没完成的任务，负责人和截止时间也列一下。') +
    bot('18:02', card('项目任务查询', '北辰交付项目 · 共享任务', `
      <div class="filter-bar" role="group" aria-label="按任务状态筛选">${filters}</div>
      <div id="task-results">${renderTaskResults()}</div>
      <div class="actions">${button('试试分派任务', 'data-go="assign"')}</div>`));
}

function assignmentCard() {
  const request = human('18:05', '<span class="mention">@OmniRelay</span> 分派个任务：下周一前把验收清单整理好。');
  if (receipt) {
    return request + bot('18:05', card('已创建并分派', '模拟回执 · ' + receipt.id, `
      <strong>${escape(receipt.title)}</strong>
      <dl class="facts">
        <div><dt>负责人</dt><dd>${escape(receipt.owner)}</dd></div>
        <div><dt>截止日期</dt><dd>${readableDate(receipt.date)}</dd></div>
        <div><dt>任务状态</dt><dd>${badge(receipt.status)}</dd></div>
      </dl>
      <div class="actions">${button('查看任务', 'data-task="' + receipt.id + '"', true)}
        ${button('返回任务查询', 'data-go="query"')}</div>`, 'receipt-header'));
  }

  const options = members.map(member => '<option' + (draft.owner === member ? ' selected' : '') + '>' + member + '</option>').join('');
  return request + bot('18:05', card('补充分派信息', '仅发起人可见 · 请选择本项目中的负责人', `
    <form class="form" id="assignment" novalidate>
      <div class="field">
        <label for="assignment-title">任务名称</label>
        <input id="assignment-title" name="title" value="${escape(draft.title)}" maxlength="80" required>
      </div>
      <div class="field-pair">
        <div class="field">
          <label for="assignment-owner">负责人</label>
          <select id="assignment-owner" name="owner" required>
            <option value="">选择项目成员</option>${options}
          </select>
        </div>
        <div class="field">
          <label for="assignment-date">截止日期 <small>选填</small></label>
          <input id="assignment-date" name="date" type="date" value="${escape(draft.date)}">
        </div>
      </div>
      <div class="field">
        <label for="assignment-note">任务说明 <small>选填</small></label>
        <textarea id="assignment-note" name="note" rows="2" maxlength="300" placeholder="补充交付要求">${escape(draft.note)}</textarea>
      </div>
      <p class="form-error" id="assignment-error" role="alert" hidden></p>
      <div class="actions"><button class="btn primary" type="submit">创建并分派</button>
        <button class="btn neutral" type="button" data-go="query">取消</button></div>
    </form>`));
}

function render(moveFocus = false) {
  const views = { brief: briefCard, query: queryCard, assign: assignmentCard };
  conversation.innerHTML = '<div class="thread">' + views[scene]() + '</div>';
  for (const node of document.querySelectorAll('.scene-button')) {
    if (node.dataset.scene === scene) node.setAttribute('aria-current', 'page');
    else node.removeAttribute('aria-current');
  }
  if (moveFocus) document.getElementById('card-heading').focus();
}

function openTask(trigger) {
  const task = tasks().find(item => item.id === trigger.dataset.task);
  if (!task) return;
  const body = `<div class="dialog-record"><dl class="facts">
      <div><dt>负责人</dt><dd>${escape(task.owner)}</dd></div>
      <div><dt>截止日期</dt><dd>${readableDate(task.date)}</dd></div>
      <div><dt>任务状态</dt><dd>${badge(task.status)}</dd></div>
      ${task.important ? '<div><dt>优先关注</dt><dd>' + badge('important') + '</dd></div>' : ''}
    </dl></div>
    ${task.note ? '<p class="dialog-task-text">' + escape(task.note) + '</p>' : ''}`;
  openDialog({title:task.title,description:task.id + ' · 示例任务',tone:'info',body,restoreFocus:() => trigger});
}

function go(next) {
  if (scene === next) return;
  scene = next;
  render(true);
}

document.querySelector('.scene-list').addEventListener('click', event => {
  const target = event.target.closest('[data-scene]');
  if (target) go(target.dataset.scene);
});

conversation.addEventListener('click', event => {
  const target = event.target.closest('button');
  if (!target) return;
  if (target.dataset.go) go(target.dataset.go);
  if (target.dataset.task) openTask(target);
  if (target.dataset.filter) {
    filter = target.dataset.filter;
    for (const toggle of conversation.querySelectorAll('[data-filter]')) {
      toggle.setAttribute('aria-pressed', String(toggle.dataset.filter === filter));
    }
    document.getElementById('task-results').innerHTML = renderTaskResults();
  }
});

conversation.addEventListener('input', event => {
  if (event.target.form?.id !== 'assignment') return;
  draft[event.target.name] = event.target.value;
  if (event.target.getAttribute('aria-invalid') !== 'true') return;
  event.target.removeAttribute('aria-invalid');
  event.target.removeAttribute('aria-describedby');
  document.getElementById('assignment-error').hidden = true;
});

conversation.addEventListener('submit', event => {
  if (event.target.id !== 'assignment') return;
  event.preventDefault();
  if (receipt) return;
  const form = event.target;
  const oldInvalid = form.querySelector('[aria-invalid="true"]');
  oldInvalid?.removeAttribute('aria-invalid');
  oldInvalid?.removeAttribute('aria-describedby');
  const input = new FormData(form);
  const title = String(input.get('title')).trim();
  const owner = input.get('owner');
  const dateField = form.elements.date;
  if (!title || !members.includes(owner) || !dateField.validity.valid) {
    const error = document.getElementById('assignment-error');
    const invalidField = !title ? form.elements.title : !members.includes(owner) ? form.elements.owner : dateField;
    error.textContent = !title ? '请输入任务名称。' : invalidField === dateField ? '请输入有效的截止日期。' : '请选择项目中的负责人。';
    error.hidden = false;
    invalidField.setAttribute('aria-invalid','true');
    invalidField.setAttribute('aria-describedby',error.id);
    invalidField.focus();
    return;
  }
  receipt = { id: 'DEMO-013', title, owner, date: String(input.get('date')), status: 'pending', note: String(input.get('note')).trim() };
  render(true);
});

document.getElementById('reset').addEventListener('click', () => {
  scene = 'brief';
  filter = 'open';
  draft = { ...initialDraft };
  receipt = null;
  render(true);
  toast('info','已重置卡片演示');
});

render();
</script>
</body>
</html>
