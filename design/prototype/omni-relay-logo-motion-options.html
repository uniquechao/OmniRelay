<!doctype html>
<html lang="zh-CN" data-theme="light"><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>OmniRelay · 加载动效对比</title><link rel="stylesheet" href="omni-relay-colors.css">
<style>
*{box-sizing:border-box}body{margin:0;font:15px/1.5 Inter,"PingFang SC",sans-serif;background:var(--or-surface);color:var(--or-text)}main{max-width:1180px;margin:auto;padding:clamp(30px,7vw,100px) clamp(16px,4vw,54px)}.top,header,.tools{display:flex;align-items:center;justify-content:space-between;gap:12px}.top{margin-bottom:32px;flex-wrap:wrap}h1,h2,p{margin:0}h1{font-size:clamp(22px,3vw,32px);letter-spacing:-.035em}h2{font-size:18px}.grid{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:16px}article{padding:18px;border:1px solid var(--or-border);border-radius:12px}small,p,label{color:var(--or-text-muted)}small{font-variant-numeric:tabular-nums}.stage{height:clamp(190px,22vw,276px);display:grid;place-items:center;overflow:hidden}.stage svg{width:64%;overflow:visible}.tools{justify-content:flex-start;flex-wrap:wrap;margin-top:22px}.tools label{display:flex;align-items:center;gap:10px}.tools input{width:min(160px,34vw);accent-color:var(--or-primary)}button{font:inherit;border:1px solid var(--or-border);border-radius:7px;padding:8px 14px;background:var(--or-surface);color:var(--or-text);min-height:44px;cursor:pointer}button:hover{background:var(--or-hover-bg)}#play{background:var(--or-primary);color:white;border-color:transparent}button:focus-visible,input:focus-visible{outline:2px solid var(--or-primary);outline-offset:3px}article p{font-size:14px;line-height:1.65}html[data-theme=dark]{color-scheme:dark}@media(max-width:720px){.grid{grid-template-columns:1fr}.stage{height:138px}.stage svg{width:110px}.top{margin-bottom:16px}.tools{position:sticky;bottom:0;background:var(--or-surface);padding:8px 0}.tools button{font-size:14px}}
</style><main><div class="top"><h1>OmniRelay 加载动效对比</h1><button id="theme">深色预览</button></div><div class="grid"><article id="orbit"><header><h2>同步合拢</h2><small>1.3 秒</small></header><div class="stage" aria-hidden="true"><svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 646 585"><defs>
          <linearGradient id="violetFaceorbit" x1="0%" y1="0%" x2="84%" y2="78%">
            <stop stop-color="#bd64ff"/><stop offset=".38" stop-color="#7444fa"/><stop offset="1" stop-color="#452ee7"/>
          </linearGradient>
          <linearGradient id="tealFaceorbit" x1="20%" y1="28%" x2="90%" y2="88%">
            <stop stop-color="#008e89"/><stop offset=".5" stop-color="#09b7b6"/><stop offset="1" stop-color="#00e2e9"/>
          </linearGradient>
        </defs>
        <g class="orbit"><path class="arc violet" fill="url(#violetFaceorbit)" d="M 101 400 L 76 367 Q 20 296 76 220 L 139 139 Q 168 103 222 103 H 420 Q 477 103 512 148 L 531 172 L 469 264 Q 442 201 386 201 H 261 Q 226 201 202 231 Q 164 275 178 317 Z"/>
        <path class="arc teal" fill="url(#tealFaceorbit)" d="M 530.5 171.5 L 572 224 Q 624 292 574 361 L 509 445 Q 480 482 422 482 H 230 Q 171 482 137 446 L 100.5 399.5 L 177.5 316.5 Q 211 384 266 384 H 383 Q 427 384 450 348 Q 482 306 468.5 263.5 Z"/></g></svg></div><p>两段环带同时沿弧线靠近，贴合前一起减速。</p></article>
<article id="relay"><header><h2>错拍接力</h2><small>1.6 秒</small></header><div class="stage" aria-hidden="true"><svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 646 585"><defs>
          <linearGradient id="violetFacerelay" x1="0%" y1="0%" x2="84%" y2="78%">
            <stop stop-color="#bd64ff"/><stop offset=".38" stop-color="#7444fa"/><stop offset="1" stop-color="#452ee7"/>
          </linearGradient>
          <linearGradient id="tealFacerelay" x1="20%" y1="28%" x2="90%" y2="88%">
            <stop stop-color="#008e89"/><stop offset=".5" stop-color="#09b7b6"/><stop offset="1" stop-color="#00e2e9"/>
          </linearGradient>
        </defs>
        <g class="orbit"><path class="arc violet" fill="url(#violetFacerelay)" d="M 101 400 L 76 367 Q 20 296 76 220 L 139 139 Q 168 103 222 103 H 420 Q 477 103 512 148 L 531 172 L 469 264 Q 442 201 386 201 H 261 Q 226 201 202 231 Q 164 275 178 317 Z"/>
        <path class="arc teal" fill="url(#tealFacerelay)" d="M 530.5 171.5 L 572 224 Q 624 292 574 361 L 509 445 Q 480 482 422 482 H 230 Q 171 482 137 446 L 100.5 399.5 L 177.5 316.5 Q 211 384 266 384 H 383 Q 427 384 450 348 Q 482 306 468.5 263.5 Z"/></g></svg></div><p>紫环先停在左侧，青环迟半拍沿右侧切入。</p></article>
<article id="trace"><header><h2>循光成环</h2><small>1.8 秒</small></header><div class="stage" aria-hidden="true"><svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 646 585"><defs>
          <linearGradient id="violetFacetrace" x1="0%" y1="0%" x2="84%" y2="78%">
            <stop stop-color="#bd64ff"/><stop offset=".38" stop-color="#7444fa"/><stop offset="1" stop-color="#452ee7"/>
          </linearGradient>
          <linearGradient id="tealFacetrace" x1="20%" y1="28%" x2="90%" y2="88%">
            <stop stop-color="#008e89"/><stop offset=".5" stop-color="#09b7b6"/><stop offset="1" stop-color="#00e2e9"/>
          </linearGradient>
        <mask id="violetInk" maskUnits="userSpaceOnUse" x="0" y="0" width="646" height="585"><path class="ink violet-ink" d="M 509 200 Q 458 150 419 150 H 222 Q 191 150 169 180 L 117 249 Q 83 294 112 333 L 143 367" fill="none" stroke="white" stroke-width="175" stroke-linecap="round" pathLength="1" stroke-dasharray="1 2"/></mask><mask id="tealInk" maskUnits="userSpaceOnUse" x="0" y="0" width="646" height="585"><path class="ink teal-ink" d="M 150 356 Q 188 434 231 434 H 389 Q 452 434 485 391 L 535 328 Q 561 293 543 260 L 497 209" fill="none" stroke="white" stroke-width="175" stroke-linecap="round" pathLength="1" stroke-dasharray="1 2"/></mask></defs>
        <g class="orbit"><path class="arc violet" mask="url(#violetInk)" fill="url(#violetFacetrace)" d="M 101 400 L 76 367 Q 20 296 76 220 L 139 139 Q 168 103 222 103 H 420 Q 477 103 512 148 L 531 172 L 469 264 Q 442 201 386 201 H 261 Q 226 201 202 231 Q 164 275 178 317 Z"/>
        <path class="arc teal" mask="url(#tealInk)" fill="url(#tealFacetrace)" d="M 530.5 171.5 L 572 224 Q 624 292 574 361 L 509 445 Q 480 482 422 482 H 230 Q 171 482 137 446 L 100.5 399.5 L 177.5 316.5 Q 211 384 266 384 H 383 Q 427 384 450 348 Q 482 306 468.5 263.5 Z"/></g></svg></div><p>颜色沿两段弧面铺开，在斜切处连成完整的环。</p></article></div><div class="tools"><button id="play">同时重播</button><label>逐帧查看<input id="time" type="range" min="0" max="1800" step="10" value="0"></label></div></main>
<script>
const duration = 1800;
const time = document.querySelector('#time');
const reduce = matchMedia('(prefers-reduced-motion: reduce)');
const curves = ['orbit','relay','trace'].map(id => {
  const card = document.getElementById(id);
  return ['violet','teal'].map(name => ({
    face:card.querySelector('.'+name), ink:card.querySelector('.'+name+'-ink')
  }));
});
let frame;
function phase(ms,start,length) {
  const t = Math.min(1, Math.max(0, (ms-start)/length));
  return t*t*(3-2*t);
}
function dock(piece, remaining, angle, dx, dy) {
  piece.face.setAttribute('transform','rotate('+angle*remaining+' 323 292.5) translate('+dx*remaining+' '+dy*remaining+')');
}
function draw(ms) {
  time.value=ms;
  time.setAttribute('aria-valuetext',(ms/1000).toFixed(2)+' 秒');
  curves.forEach((pieces,index) => pieces.forEach((piece,side) => {
    const direction = side ? 1 : -1;
    if(index===0) {
      dock(piece,1-phase(ms,0,1300),16,0,direction*104);
    } else if(index===1) {
      dock(piece,1-phase(ms,side?450:0,side?1150:850),side?19:9,direction*20,direction*(side?119:80));
    } else {
      const p=phase(ms,side?100:0,side?1700:1640);
      dock(piece,1-p,9,0,direction*42);
      piece.ink.setAttribute('stroke-dashoffset',1-p);
      piece.face.style.opacity=Math.min(1,p*8);
    }
  }));
}
function play() {
  cancelAnimationFrame(frame);
  if(reduce.matches){draw(duration);return;}
  const start=performance.now();
  function step(now){
    const ms=Math.min(duration,now-start);
    draw(ms);
    if(ms<duration)frame=requestAnimationFrame(step);
  }
  draw(0);frame=requestAnimationFrame(step);
}
time.oninput=()=>{cancelAnimationFrame(frame);draw(Number(time.value));};
document.querySelector('#play').onclick=play;
document.querySelector('#theme').onclick=event=>{
  const dark=document.documentElement.dataset.theme==='light';
  document.documentElement.dataset.theme=dark?'dark':'light';
  event.currentTarget.textContent=dark?'浅色预览':'深色预览';
};
reduce.addEventListener('change',play);
play();
</script></html>
