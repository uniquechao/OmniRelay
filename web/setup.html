<!doctype html>
<html lang="zh-CN" data-theme="light">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>首次配置 · OmniRelay</title>
<link rel="icon" href="/omni-relay-avatar.png">
<link rel="stylesheet" href="/omni-relay-colors.css">
<script src="/omni-relay-theme.js"></script>
<link rel="stylesheet" href="/workbench.css">
<link rel="stylesheet" href="/omni-relay-ui.css">
<link rel="stylesheet" href="/omni-relay-system.css">
</head>
<body>
<main class="login-content setup-page" aria-labelledby="setup-heading">
  <div class="login-top">
    <button class="button neutral theme-toggle" type="button" data-theme-toggle data-theme-icon aria-label="切换深色主题" aria-pressed="false" title="切换深色主题"></button>
  </div>
  <section class="login-entry">
    <div class="login-logo"><img src="/omni-relay-logo-bicolor.png" width="195" height="65" alt="OmniRelay"></div>
    <h1 id="setup-heading">首次配置</h1>
    <p class="setup-callback" id="setup-callback" hidden>
      在飞书开放平台登记重定向 URL <code translate="no"></code>
    </p>
    <form class="login-form" id="setup-form" method="post" action="/setup" autocomplete="off">
      <div class="field">
        <label for="setup-code">一次性设置码</label>
        <input id="setup-code" name="setup_code" type="password" autocomplete="off" required maxlength="43" aria-describedby="setup-code-help">
        <small id="setup-code-help">向部署管理员获取设置码。</small>
      </div>
      <div class="field">
        <label for="app-id" translate="no">飞书 App ID</label>
        <input id="app-id" name="app_id" autocomplete="off" autocapitalize="none" spellcheck="false" required maxlength="256" pattern="cli_[A-Za-z0-9_\-]+">
      </div>
      <div class="field">
        <label for="app-secret" translate="no">飞书 App Secret</label>
        <input id="app-secret" name="app_secret" type="password" autocomplete="off" required maxlength="512">
      </div>
      <p id="setup-admin-help">使用要设为首位管理员的飞书账号完成授权。</p>
      <button class="button primary login-button" type="submit" aria-describedby="setup-admin-help" disabled>使用飞书授权并保存</button>
    </form>
    <p id="setup-feedback" class="login-feedback" role="status" tabindex="-1" hidden></p>
    <noscript>请在浏览器中启用 JavaScript 后重新加载此页。</noscript>
  </section>
</main>
<script src="/setup.js" defer></script>
</body>
</html>
